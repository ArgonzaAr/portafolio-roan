<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Angel Argonza">
  <defs>
    <linearGradient id="aa-mark" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8bb8ff" />
      <stop offset="1" stop-color="#1f6feb" />
    </linearGradient>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="104" fill="#070d18" />
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="rgba(120,160,220,0.28)" stroke-width="4" />

  <g fill="none" stroke="url(#aa-mark)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <!-- Ángulo izquierdo '<' -->
    <path d="M 160 176 L 80 256 L 160 336" />
    <!-- Barra '/' -->
    <path d="M 280 168 L 232 368" />
    <!-- Ángulo derecho '>' -->
    <path d="M 352 176 L 432 256 L 352 336" />
  </g>

  <!-- Detalle único: punto de acento marcando el inicio de la diagonal, como un cursor/nodo -->
