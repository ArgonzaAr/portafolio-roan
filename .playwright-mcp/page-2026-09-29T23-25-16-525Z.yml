      - heading "El camino hasta aquí" [level=2] [ref=f10e57]
      - list [ref=f10e58]:
        - listitem [ref=f10e59]:
          - generic [ref=f10e61]:
            - img "Primer encuentro" [ref=f10e63]
            - paragraph [ref=f10e64]: Primer encuentro
            - heading "El comienzo de todo" [level=3] [ref=f10e65]
            - paragraph [ref=f10e66]: Entre clases y pasillos universitarios nació algo que ninguno de los dos esperaba. Fue al final de esa etapa cuando nuestros caminos se cruzaron y comenzó nuestra historia.
        - listitem [ref=f10e67]:
          - generic [ref=f10e69]:
            - img "Primera aventura" [ref=f10e71]
            - paragraph [ref=f10e72]: Primera aventura
            - heading "El viaje que nos marcó" [level=3] [ref=f10e73]
            - paragraph [ref=f10e74]: Toluca fue el escenario de uno de nuestros primeros recuerdos juntos. Luces, buenos postres y la certeza de que queríamos seguir descubriendo el mundo el uno al lado del otro.
        - listitem [ref=f10e75]:
          - generic [ref=f10e77]:
            - img "Nuestro amor" [ref=f10e79]
            - paragraph [ref=f10e80]: Nuestro amor
            - heading "Lo que nos une" [level=3] [ref=f10e81]
            - paragraph [ref=f10e82]: Cada momento juntos es único. Hemos aprendido a crecer, a escucharnos y a amarnos más con cada día que pasa.
        - listitem [ref=f10e83]:
          - generic [ref=f10e85]:
            - img "Para siempre" [ref=f10e87]
            - paragraph [ref=f10e88]: Para siempre
            - heading "La historia continúa" [level=3] [ref=f10e89]
            - paragraph [ref=f10e90]: "Hoy damos el paso más importante: consolidar nuestro amor en un para siempre. Gracias por ser parte de este capítulo."
